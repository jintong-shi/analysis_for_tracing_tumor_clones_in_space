## sample input ##
sample_type: "freshfrozen"
sample: "HT268B1-Th1H3Fc2U12Z1Bs1"
input_path: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/source_links/spaceranger/HT268B1-Th1H3Fc2U12Z1Bs1/outs"
decon_csv: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/source_links/cell2location_output/HT268B1-Th1H3Fc2U12Z1Bs1/Decon_prop.csv"
threads: 8

tools: ["infercnv"]
run_combos: ["decon_stromaimm_ref"]

decon:
  epi_celltypes: "Epithelial"
  stroma_celltypes: "Fibroblasts,Endothelial,Pericytes"
  imm_celltypes: "Macrophages,T_cells,B_cells,Plasma,DC"

cell2location:
  run: False
  sc_ref_folder: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/source_links/sc_ref/HT268B1-Th1H3"

params:
  epi_threshold: 0.5
  ref_top_frac: 0.10

display:
  decon_stromaimm_ref: "Decon_StromaImm-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/run_links"

## ref path ##
infercnv:
  gene_pos_file: "<REF_ROOT>/gencode_v38_gene_pos.txt"
  HMM: true
