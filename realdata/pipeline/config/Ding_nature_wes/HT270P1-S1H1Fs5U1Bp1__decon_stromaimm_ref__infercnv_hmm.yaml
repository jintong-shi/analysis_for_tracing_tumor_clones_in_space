## sample input ##
sample_type: "ffpe"
sample: "HT270P1-S1H1Fs5U1Bp1"
input_path: "<DATA_ROOT>/realdata_mappingWES/public_data/standard_spaceranger/HT270P1-S1H1Fs5U1Bp1/outs"
decon_csv: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/source_links/cell2location_output/HT270P1-S1H1Fs5U1Bp1_deconvolution.csv"
threads: 8

tools: ["infercnv"]
run_combos: ["decon_stromaimm_ref"]

decon:
  epi_celltypes: "Epithelial,Tumor"
  stroma_celltypes: "Endothelial,Fibroblasts"
  imm_celltypes: "B-cells,Macrophages,Mast,Plasma,T-cells"

cell2location:
  run: False

params:
  epi_threshold: 0.5
  ref_top_frac: 0.10

display:
  decon_stromaimm_ref: "Decon_StromaImm-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/run_links"

## ref path ##
infercnv:
  gene_pos_file: "<REF_ROOT>/gencode_v38_gene_pos.txt"
  HMM: true
