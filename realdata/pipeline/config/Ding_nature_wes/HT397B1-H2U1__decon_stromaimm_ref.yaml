## sample input ##
sample_type: "ffpe"
sample: "HT397B1-H2U1"
input_path: "<DATA_ROOT>/realdata_mappingWES/public_data/standard_spaceranger/HT397B1-S1H2Fs4U1Bp1/outs"
decon_csv: "<DATA_ROOT>/realdata_mappingWES/deconv/HT397B1-S1H2Fs4U1Bp1_deconvolution.csv"
threads: 8

tools: ["conicsmat", "copykat", "copyvae", "infercnv", "infercnvpy", "scevan", "starch", "tuscan"]
run_combos: ["decon_stromaimm_ref"]

decon:
  epi_celltypes: "Tumor_prop,Basal_prop"
  stroma_celltypes: "Endothelial_prop,Fibroblast_prop,Pericyte_prop"
  imm_celltypes: "B_prop,Lymphatic_prop,Macrophage_prop,Plasma_prop,T_prop,mregDC_prop,pDC_prop"

cell2location:
  run: False

params:
  epi_threshold: 0.5
  ref_top_frac: 0.10

display:
  decon_stromaimm_ref: "Decon_StromaImm-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/run_links"

## ref path ##
infercnv:
  gene_pos_file: "<REF_ROOT>/gencode_v38_gene_pos.txt"
  HMM: false
conicsmat:
  chrom_arm_file: "<TOOLS_ROOT>/CONICSmat/chromosome_arm_positions_grch38.txt"
copyvae_gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
copyvae_cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
copyvae:
  cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
  gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
starch:
  n_clusters: 3
  output_name: STARCH
  repo_dir: "<TOOLS_ROOT>"
