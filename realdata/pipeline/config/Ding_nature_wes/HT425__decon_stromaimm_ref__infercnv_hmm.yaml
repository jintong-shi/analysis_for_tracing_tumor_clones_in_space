## sample input ##
sample_type: "ffpe"
sample: "HT425"
input_path: "<DATA_ROOT>/realdata_mappingWES/public_data/standard_spaceranger/HT425B1-S1H2Fs1U1Bp1/outs"
decon_csv: "<DATA_ROOT>/realdata_mappingWES/deconv/HT425B1-S1H2Fs1U1Bp1_deconvolution.csv"
threads: 8

tools: ["infercnv"]
run_combos: ["decon_stromaimm_ref"]

decon:
  epi_celltypes: "prop_Basal,prop_LumHR,prop_LumSec,prop_Tumor"
  stroma_celltypes: "prop_Endothelial,prop_Fibroblast,prop_Pericyte"
  imm_celltypes: "prop_B,prop_Macrophage,prop_Plasma,prop_T"

cell2location:
  run: False

params:
  epi_threshold: 0.5
  ref_top_frac: 0.10

display:
  decon_stromaimm_ref: "Decon_StromaImm-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/Ding_nature_wes/run_links"

## ref path ##
infercnv:
  gene_pos_file: "<REF_ROOT>/gencode_v38_gene_pos.txt"
  HMM: true
