## sample input ##
sample_type: "ffpe"
sample: "pt15_P1"
input_path: "<DATA_ROOT>/Prostate_Oxford/orig_data/pt15_P1"
threads: 8

tools: ["copykat", "copyvae", "scevan", "starch", "tuscan"]
run_combos: ["allspots_no_ref"]

display:
  allspots_no_ref: "AllSpots_no-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/metastatic_prostate_ffpe/run_links"

## ref path ##
copyvae_gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
copyvae_cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
copyvae:
  cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
  gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
starch:
  n_clusters: 3
  output_name: STARCH
  repo_dir: "<TOOLS_ROOT>"
