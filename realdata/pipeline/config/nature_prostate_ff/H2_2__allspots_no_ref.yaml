## sample input ##
sample_type: "freshfrozen"
sample: "H2_2"
input_path: "<DATA_ROOT>/realdata/datasets/nature_prostate_ff/truth_links/per_sample/H2_2/spaceranger_out/outs"
threads: 8

tools: ["calicost", "copykat", "copyvae", "scevan", "starch", "tuscan"]
run_combos: ["allspots_no_ref"]

display:
  allspots_no_ref: "AllSpots_no-ref"

## output path ##
outroot: "<DATA_ROOT>/realdata/datasets/nature_prostate_ff/run_links"

## ref path ##
copyvae_gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
copyvae_cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
copyvae:
  cell_cycle_file: "<TOOLS_ROOT>/copyVAE/data/Macosko_cell_cycle_genes.txt"
  gene_map_csv: "<REF_ROOT>/hg38_gene_map.csv"
starch:
  n_clusters: 3
  output_name: STARCH
  repo_dir: "<TOOLS_ROOT>"
